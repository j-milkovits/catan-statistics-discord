[tool.poetry]
name = "catan-statistics-discord"
version = "0.1.0"
description = "discord bot to collect and retrieve catan game data"
license = "MIT"
authors = ["j-milkovits <j.milkovits.t@posteo.net>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
discord-py = "^2.4.0"
matplotlib = "^3.9.2"
python-dotenv = "^1.0.1"


[tool.poetry.group.dev.dependencies]
isort = "^5.13.2"
black = "^24.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
